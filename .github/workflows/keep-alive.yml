# Keeps the Render free-tier instance awake.
#
# Render spins a free service down after 15 minutes without traffic, so the
# next visitor would otherwise sit through a ~50s cold start behind Render's
# branded page. GitHub's scheduler can occasionally run a job late (sometimes
# badly), so a single ping per run is not enough insurance: each hourly job
# instead pings every ~7 minutes for the whole hour. As long as a run starts
# within ~50 minutes of its slot, coverage never breaks — and even a delayed
# neighbour run is picked up because cancel-in-progress kills the stale one.
#
# The cache-busting query string guarantees the request reaches the origin
# even if Cloudflare ever caches the path; --fail turns a non-200 into a
# red run so failures are visible in the Actions tab; workflow_dispatch
# allows a manual run after setup.
name: Keep Render awake

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Ping every 7 minutes for an hour
        run: |
          for i in $(seq 1 9); do
            echo "ping $i at $(date -u +%H:%M:%S)Z"
            curl -sS --fail --retry 3 --retry-delay 5 --max-time 30 \
              -A "Mozilla/5.0 (compatible; BareayaKeepAlive)" \
              -o /dev/null -w '%{http_code}\n' \
              "https://bareaya.in/api/health?cb=$(date +%s)" \
              || { echo "ping $i FAILED"; exit 1; }
            sleep 390
          done
