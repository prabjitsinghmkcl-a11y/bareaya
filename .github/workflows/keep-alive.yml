# Keeps the Render free-tier instance awake.
#
# Render spins a free service down after 15 minutes without traffic, so the
# next visitor would otherwise sit through a ~50s cold start behind Render's
# branded page.
#
# GitHub's scheduler is best-effort: an hourly cron was observed running only
# every 2-5 hours, which is far outside the 15-minute sleep window. Instead we
# schedule the shortest interval GitHub allows (5 minutes) and ping once per
# run. Runs that overlap are cancelled, so a delayed backlog can never keep the
# newest ping from firing. Even when the scheduler is throttled, the gaps stay
# well under 15 minutes in practice.
#
# The cache-busting query string guarantees the request reaches the origin
# even if Cloudflare ever caches the path; --fail turns a non-200 into a
# red run so failures are visible in the Actions tab; workflow_dispatch
# allows a manual run after setup.
#
# NOTE: GitHub schedules remain best-effort. For a guaranteed 24/7 warm
# instance use a dedicated pinger (UptimeRobot free, 5-minute checks) or move
# the service to a paid Render plan.
name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        run: |
          echo "ping at $(date -u +%H:%M:%S)Z"
          curl -sS --fail --retry 3 --retry-delay 5 --max-time 40 \
            -A "Mozilla/5.0 (compatible; BareayaKeepAlive)" \
            -o /dev/null -w '%{http_code}\n' \
            "https://bareaya.in/api/health?cb=$(date +%s)"
