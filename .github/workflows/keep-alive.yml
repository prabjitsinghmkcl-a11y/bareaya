# Keeps the Render free-tier instance awake.
#
# Render spins a free service down after ~15 minutes without traffic, so the
# first visitor would otherwise hit a cold start: a blank/Render page while
# the app boots (sometimes 30-60s). Pinging the health endpoint every 14
# minutes keeps it warm around the clock. The cache-busting query string
# guarantees the request reaches the origin even if Cloudflare ever caches
# the path, and workflow_dispatch allows a manual run after setup.
name: Keep Render awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the health endpoint
        run: >
          curl -sS --max-time 30 -A "Mozilla/5.0 (compatible; BareayaKeepAlive)"
          -o /dev/null -w '%{http_code}\n'
          "https://bareaya.in/api/health?cb=$(date +%s)"
