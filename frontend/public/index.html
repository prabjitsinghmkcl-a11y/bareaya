<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F2B24" />
    <meta
      name="description"
      content="Bareaya — clean, honest skincare formulated for Indian skin. Shop serums, moisturisers and SPF by ingredient or by concern."
    />

    <!-- Every product, ingredient and editorial image is served from Cloudinary.
         Warming the connection early removes a full DNS + TLS round trip from
         the critical path. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/aao6ldeb/image/upload/f_auto,q_auto,w_64,h_64,c_fill,g_auto/v1789571534/bareaya/site/logo.png"
    />
    <link
      rel="apple-touch-icon"
      href="https://res.cloudinary.com/aao6ldeb/image/upload/f_auto,q_auto,w_180,h_180,c_fill,g_auto/v1789571534/bareaya/site/logo.png"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Bareaya</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
